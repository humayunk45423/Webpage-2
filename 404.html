<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('portfolio-theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
                var savedLang = localStorage.getItem('portfolio-lang') || 'en';
                document.documentElement.setAttribute('data-lang', savedLang);
                document.documentElement.setAttribute('lang', savedLang);
            } catch (e) {}
        })();
    </script>
    <title>404 - Page Not Found | Humayoun Kobir</title>
    <meta name="description" content="404 - Page Not Found. Explore the portfolio of Humayoun Kobir (Humayun Kabir) or browse software utilities on Software HQ.">
    <link rel="canonical" href="https://humayounkobir.vercel.app/404">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="assets/site-images/Name%20logo.svg">
    <link rel="apple-touch-icon" href="assets/site-images/Name%20logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=32">
    <style>
        .error-header {
            max-width: 1120px;
            margin: 1.25rem auto 0;
            padding: 0 1.25rem;
        }
        .error-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.85rem 1.35rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            box-shadow: var(--shadow2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .error-brand {
            font-weight: 900;
            font-size: 1.05rem;
            color: var(--text);
            text-decoration: none;
            letter-spacing: -0.02em;
        }
        .error-nav-links {
            display: flex;
            align-items: center;
            gap: 1.15rem;
        }
        .error-nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }
        .error-nav-links a:hover {
            color: var(--accent);
        }
        .error-container {
            min-height: 76vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.25rem;
        }
        .error-card {
            max-width: 580px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 3rem 2.25rem;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .error-code {
            font-size: clamp(4.75rem, 14vw, 8.5rem);
            font-weight: 900;
            background: var(--vibrant-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            letter-spacing: -0.04em;
            margin-bottom: 0.85rem;
        }
        .error-title {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 800;
            margin-bottom: 0.85rem;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        .error-desc {
            color: var(--muted);
            max-width: 460px;
            margin: 0 auto 2rem;
            line-height: 1.65;
            font-size: 0.98rem;
            user-select: text;
        }
        .error-actions {
            display: flex;
            gap: 0.85rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.65rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.92rem;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .btn-primary {
            background: var(--vibrant-gradient);
            color: var(--accent-ink);
            box-shadow: 0 10px 26px var(--soft);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 34px var(--soft);
        }
        .btn-secondary {
            background: var(--bg2);
            color: var(--text);
            border: 1px solid var(--line);
        }
        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header class="error-header">
        <nav class="error-nav" aria-label="Main Navigation">
            <a href="/" class="error-brand">Humayoun Kobir</a>
            <div class="error-nav-links">
                <a href="/">Portfolio</a>
                <a href="/files">Software HQ</a>
                <a href="/#contact">Contact</a>
            </div>
        </nav>
    </header>

    <main id="main-content" class="error-container">
        <div class="error-card">
            <div class="error-code" aria-hidden="true">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc">
                The resource you are looking for might have been removed, had its name changed, or is temporarily unavailable. Explore the portfolio or visit Software HQ.
            </p>
            <div class="error-actions">
                <a href="/" class="btn-action btn-primary">Return Home</a>
                <a href="/files" class="btn-action btn-secondary">Browse Software HQ</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Humayoun Kobir. All rights reserved.</p>
        </div>
    </footer>

    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
